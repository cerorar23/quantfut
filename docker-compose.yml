services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qf
      POSTGRES_PASSWORD: ${PG_PASSWORD:?define PG_PASSWORD}
      POSTGRES_DB: quantfut
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qf -d quantfut"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: redis-server --save 60 1 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redisdata:/data]
    restart: unless-stopped

  # Las imágenes son las que corren en el servidor (DEPLOYS.md); cada despliegue
  # actualiza aquí su etiqueta. Los archivos de /home/qf/.config/quantfut son
  # credenciales del host, fuera del repo.
  api:
    build: .
    image: quantfut-api-sin-leyendas-tenis:7c1892f
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - chain:/srv/quantfut/chain
      - artifacts:/srv/quantfut/artifacts
      - escudos:/srv/quantfut/escudos:ro
      - /home/qf/.config/quantfut/firebase-backend.json:/run/secrets/quantfut-firebase.json:ro
      - /home/qf/.config/quantfut/google-play.json:/run/secrets/quantfut-play.json:ro
    environment:
      FIREBASE_PROJECT_ID: pronosticos-deportivos-85ffa
      FIREBASE_AUTH_ENABLED: '1'
      FIREBASE_APPCHECK_ENFORCE: '0'
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/quantfut-firebase.json
      PLAY_SERVICE_ACCOUNT_FILE: /run/secrets/quantfut-play.json
      PLAY_PACKAGE_NAME: com.saptain.quantfut
      PLAY_RTDN_AUDIENCE: https://pronosticosdeportivos.pro/app/v1/compras/google/rtdn
      PLAY_RTDN_SERVICE_ACCOUNT: quantfut-play@pronosticos-deportivos-85ffa.iam.gserviceaccount.com
      STORE_PURCHASES_ENABLED: '1'
    restart: unless-stopped

  worker:
    build: .
    image: quantfut-worker:4907a0d
    env_file: .env
    environment:
      # Registro público de la cadena (comprometer-revelar, 18-oct).
      CHAIN_GIT_REMOTE: git@github.com:cerorar23/quantfut-registro.git
      GIT_SSH_COMMAND: ssh -i /run/secrets/registro/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/run/secrets/registro/known_hosts -o StrictHostKeyChecking=yes
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - chain:/srv/quantfut/chain
      - /home/qf/.config/quantfut/registro:/run/secrets/registro:ro
      - artifacts:/srv/quantfut/artifacts
      - escudos:/srv/quantfut/escudos
      - ./scripts/crontab:/etc/cron.d/quantfut:ro
      # Los logs del cron (>> /var/log/*.log) se perdían en cada
      # despliegue: así se borró la salida del chequeo diario (oct-2026).
      - workerlogs:/var/log
      # Archivo del recolector SofaScore (Apify) del host, solo lectura.
      - /home/qf/sofascore-apify/data:/srv/quantfut/sofascore:ro
    # cron no hereda el entorno del contenedor: se lo pasa pam_env leyendo
    # /etc/environment. Se vuelca ENTERO. La versión anterior filtraba por
    # prefijos y dejaba fuera las claves de las APIs, así que los jobs que las
    # usaban fallaban en cada pasada.
    # `command: >` (folded) junta las líneas con espacios: la versión anterior
    # tenía tres pasos separados solo por saltos de línea, así que sin `&&`
    # entre ellos "cron -f" quedaba como argumento de `crontab` en vez de
    # arrancar el demonio — el cron nunca corrió. `crontab <archivo>` solo
    # necesita leer el archivo (root puede, aunque el volumen sea :ro); el
    # `chmod` no hacía falta y encima fallaba contra el montaje de solo
    # lectura, así que se quita.
    command: >
      sh -c "printenv | grep -v -E '^(HOSTNAME|HOME|PWD|SHLVL|_)=' > /etc/environment &&
             crontab /etc/cron.d/quantfut &&
             cron -f"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?define GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://panel.${DOMAIN:-localhost}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?define GRAFANA_DB_PASSWORD}
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    networks: [default, nba_dashboard]
    env_file: .env
    depends_on:
      - api
      - grafana
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Origin Certificate de Cloudflare, instalado en el host (fuera del repo).
      - /etc/ssl/quantfut:/etc/ssl/quantfut:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

  # Correo con Proton Mail Bridge (opcional). Solo hace falta si NO usas el
  # envío SMTP oficial de Proton (smtp.protonmail.ch con token SMTP y dominio
  # propio), que no necesita ningún contenedor. Ver src/qf/comercial/correo.py.
  # Imagen: github.com/shenxn/protonmail-bridge-docker (GPL-3.0) compilada
  # desde un commit fijo: la de Docker Hub se quedó en la 3.19 (abr-2025).
  # Login (una vez, interactivo, admite 2FA):
  #   docker compose --profile proton-bridge run --rm protonmail-bridge init
  #   (dentro: login, después info para ver usuario/contraseña SMTP, exit)
  #   docker compose --profile proton-bridge up -d protonmail-bridge
  # Sin puertos publicados: la API le habla por la red interna de Compose.
  protonmail-bridge:
    profiles: ["proton-bridge"]
    build:
      context: https://github.com/shenxn/protonmail-bridge-docker.git#a5d3dd2f4af4cfa895aad401655a50f7c956b3d7:build
      args:
        version: v3.27.1
    volumes:
      - protonmail:/root
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  grafanadata:
  chain:
  artifacts:
  escudos:
  workerlogs:
  caddydata:
  caddyconfig:
  protonmail:

networks:
  default:
  nba_dashboard:
    external: true
    name: nba-dashboard-run69
