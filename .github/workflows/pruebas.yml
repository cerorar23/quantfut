name: pruebas

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web, datos reales y CSS anterior obligatorio
        run: npm --prefix frontend run check

  arnes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install -e 'apps/tenis[test]'
      - name: Esquema de la base de pruebas
        run: python scripts/ci_aplicar_esquema.py
        env:
          PGBASE: postgresql://postgres:ci@localhost:5432
      - name: Pruebas (incluidas las que necesitan Postgres)
        run: python -m pytest tests -q
        env:
          PYTHONPATH: src:apps/tenis/src
          QF_TEST_PG_DSN: postgresql://postgres:ci@localhost:5432/qf_test
          # Las pruebas anteriores usan la configuración por defecto: que apunte también a la base de pruebas
          PG_DSN: postgresql://postgres:ci@localhost:5432/qf_test

  nba:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nba-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/nba/pyproject.toml
      - run: pip install -e 'apps/nba[test,pdf,postgres,v2]'
      - name: Pruebas del motor NBA, plantillas y sellado
        run: python -m pytest apps/nba/tests -q -p no:cacheprovider
        env:
          PYTHONPATH: apps/nba/src
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          NBA_TEST_PG_ADMIN_DSN: postgresql://postgres:nba-ci@localhost:5432/postgres

  tenis:
    # Motor de tenis (estudio sin lucro): independiente del de fútbol, sin base de datos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/tennis/requirements.txt
      - run: pip install -r apps/tennis/requirements.txt pytest
      - name: Pruebas del motor de tenis
        run: python -m pytest apps/tennis/tests -q -p no:cacheprovider
        env:
          PYTHONPATH: apps/tennis

  tenis_v2:
    # Rediseño del motor de tenis (apps/tenis): base `tenis` con inmutabilidad, lectura PIT, sellado y contratos.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tenis-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/tenis/pyproject.toml
      - run: pip install -e 'apps/tenis[test]' pandas pyarrow
      - name: Pruebas del motor de tenis v2 (contratos, recibos y base de datos)
        run: python -m pytest apps/tenis/tests -q -p no:cacheprovider
        env:
          PYTHONPATH: apps/tenis/src:src
          QF_TEST_PG_DSN: postgresql://postgres:tenis-ci@localhost:5432/postgres

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
