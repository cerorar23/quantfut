[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantnba"
version = "0.1.0"
description = "Pronosticos NBA experimentales con datos y auditoria propios"
requires-python = ">=3.12"
dependencies = ["numpy==2.1.3", "scipy==1.14.1", "httpx==0.28.1", "pyarrow==18.1.0", "tzdata==2026.3"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
postgres = ["psycopg[binary]==3.2.3"]

[project.scripts]
quantnba = "nba.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nba = ["sql/*.sql", "odds_sources.json", "props_sources.json", "paper_protocol.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
