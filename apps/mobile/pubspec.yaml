name: gobet
description: QuantFut mobile app connected to the football data and prediction API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  dotted_border: ^3.1.0
  buttons_tabbar: ^1.3.15
  fl_chart: ^1.2.0
  provider: ^6.1.5+1
  page_transition: ^2.2.2
  clock: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'image/batting app icon.png'
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - image/
    - assets/model/market_evidence.json
  fonts:
    - family: Gilroy Black
      fonts:
        - asset: fonts/Gilroy-Black.ttf
    - family: Gilroy Light
      fonts:
        - asset: fonts/Gilroy-Light.ttf
    - family: Gilroy Heavy
      fonts:
        - asset: fonts/Gilroy-Heavy.ttf
    - family: Gilroy Medium
      fonts:
        - asset: fonts/Gilroy-Medium.ttf
    - family: Gilroy Bold
      fonts:
        - asset: fonts/Gilroy-Bold.otf
    - family: Gilroy ExtraBold
      fonts:
        - asset: fonts/Gilroy-ExtraBold.otf
