name: gobet
description: QuantFut mobile app connected to the football data and prediction API.
publish_to: 'none'
version: 1.1.0+5

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_screenutil: ^5.9.3
  dotted_border: ^3.1.0
  buttons_tabbar: ^1.3.15
  fl_chart: ^1.2.0
  provider: ^6.1.5+1
  page_transition: ^2.2.2
  clock: ^1.1.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_performance: ^0.11.6
  firebase_remote_config: ^6.7.0
  firebase_app_check: ^0.4.8
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  sentry_flutter: 10.0.0
  flutter_svg: ^2.3.0
  share_plus: ^13.3.1
  google_mobile_ads: ^9.1.0
  facebook_app_events: 0.31.0
  in_app_purchase: 3.3.1
  app_tracking_transparency: 2.0.7
  package_info_plus: ^10.2.2
  in_app_purchase_android: ^0.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'image/quantfut_icon.png'
  adaptive_icon_background: '#090f1a'
  adaptive_icon_foreground: 'image/quantfut_icon_foreground.png'
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - image/
    - assets/model/market_evidence.json
  fonts:
    - family: Rajdhani
      fonts:
        - asset: fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500
    - family: Gilroy Black
      fonts:
        - asset: fonts/Gilroy-Black.ttf
    - family: Gilroy Light
      fonts:
        - asset: fonts/Gilroy-Light.ttf
    - family: Gilroy Heavy
      fonts:
        - asset: fonts/Gilroy-Heavy.ttf
    - family: Gilroy Medium
      fonts:
        - asset: fonts/Gilroy-Medium.ttf
    - family: Gilroy Bold
      fonts:
        - asset: fonts/Gilroy-Bold.otf
    - family: Gilroy ExtraBold
      fonts:
        - asset: fonts/Gilroy-ExtraBold.otf
