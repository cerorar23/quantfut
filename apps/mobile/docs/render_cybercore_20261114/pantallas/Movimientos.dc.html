<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis movimientos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#07080c;color:#f0f1f5;font-family:'Exo 2',system-ui,sans-serif;font-size:14px;line-height:1.35;--p:#12141d;--p2:#181a25;--b:rgba(0,240,255,.2);--bs:rgba(0,240,255,.48);--ln:rgba(116,125,153,.22);--cy:#00f0ff;--gr:#05ffa1;--ye:#fcee0a;--mg:#ff2a6d;--mu:#b2b7c7;--fa:#939ab0;--d:'Rajdhani',sans-serif;--m:'JetBrains Mono',monospace;--cut:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));--cut2:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))">
<header style="height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 14px 0 6px;border-bottom:1px solid var(--b)">
<a href="Coins.dc.html" aria-label="Volver a Coins" style="width:44px;height:44px;display:grid;place-items:center;color:var(--mu)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex-grow:1;font:700 18px var(--d);letter-spacing:.1em">MIS MOVIMIENTOS</div>
</header>
<main style="flex-grow:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px">
<section style="flex:none;border:1px solid rgba(252,238,10,.45);background:var(--p);clip-path:var(--cut2);padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end">
<div><div style="font:700 10px var(--d);letter-spacing:.14em;color:var(--fa)">SALDO</div><div style="font:700 30px/1 var(--m);color:var(--ye);text-shadow:0 0 18px rgba(252,238,10,.3)">{{saldo}}</div></div>
<div><div style="font:700 10px var(--d);letter-spacing:.14em;color:var(--fa)">GANADAS</div><div style="font:700 18px var(--m);color:var(--gr)">{{gan}}</div></div>
<div><div style="font:700 10px var(--d);letter-spacing:.14em;color:var(--fa)">GASTADAS</div><div style="font:700 18px var(--m);color:var(--mu)">{{gas}}</div></div>
</section>
<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<div style="border:1px solid var(--b);background:var(--p)">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display:{{r.dayD}};padding:6px 12px;background:rgba(0,240,255,.05);font:700 10px var(--d);letter-spacing:.16em;color:var(--cy);border-bottom:1px solid var(--ln)">{{r.day}}</div>
<div style="min-height:58px;display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;padding:6px 12px;border-bottom:1px solid var(--ln)">
<span style="width:36px;height:36px;display:grid;place-items:center;border:1px solid {{r.c}};background:{{r.bg}};color:{{r.c}};clip-path:var(--cut)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
<span style="min-width:0"><strong style="display:block;font-size:14px">{{r.l}}</strong><span style="font-size:12px;color:var(--fa)">{{r.s}}</span></span>
<span style="font:700 18px var(--m);color:{{r.c}}">{{r.a}}</span>
</div>
</sc-for>
</div>
<button onClick="{{toggle}}" style="min-height:44px;flex:none;cursor:pointer;border:1px solid var(--bs);background:rgba(0,240,255,.05);color:var(--cy);font:700 14px var(--d);letter-spacing:.1em;clip-path:var(--cut)">{{more}}</button>
</sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="border:1px dashed var(--ln);padding:40px 16px;text-align:center"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#939ab0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v10M15 9.500h-4.500a1.500 1.500 0 000 3h3a1.500 1.500 0 010 3H9"></path></svg><div style="font:700 16px var(--d);letter-spacing:.1em;margin-top:8px">TODAVÍA NO HAY MOVIMIENTOS</div><a href="Coins.dc.html" style="display:inline-block;margin-top:10px;color:var(--cy);font:700 13px var(--d);letter-spacing:.1em">GANAR MONEDAS</a></div>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vacio":{"editor":"text","default":""},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const vacio = this.props.vacio === '1' || this.props.vacio === 1 || this.props.vacio === true;
const open = !!(this.state || {}).open;
const I = { unlock: 'M5 11h14v10H5zM8 11V7a4 4 0 018 0v4', check: 'M5 12l5 5 9-10', video: 'M3 5h18v14H3zM10 9l5 3-5 3z', gift: 'M4 9h16v11H4zM2 5h20v4H2zM12 5v15', users: 'M9 5a3.500 3.500 0 100 7 3.500 3.500 0 000-7zM2 20c0-3.300 3-5 7-5s7 1.700 7 5M19 8v6M16 11h6', undo: 'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3' };
const A = [
['HOY', 'unlock', 'Pronóstico desbloqueado', 'Mallorca – Córdoba · 12:40', -40],
['', 'check', 'Asistencia', 'Día 5 de 7 · 08:15', 10],
['', 'video', 'Video con recompensa', '08:20', 5],
['AYER', 'gift', 'Oferta completada', 'Ofertas para ganar monedas · 19:02', 200],
['', 'users', 'Premio por invitar', 'Un amigo se unió · 17:30', 50],
['', 'unlock', 'Pronóstico desbloqueado', 'Fritz – Tirante · 12:10', -40],
['ANTES', 'users', 'Premio de bienvenida', 'Código de invitación · 11 nov', 20],
['', 'undo', 'Oferta anulada', 'Revertida por el socio · 10 nov', -200],
['', 'check', 'Asistencia', 'Día 4 de 7 · 10 nov', 10]
];
const list = vacio ? [] : (open ? A : A.slice(0, 5));
const rows = list.map((x) => {
const pos = x[4] > 0;
return { day: x[0], dayD: x[0] ? 'block' : 'none', icon: I[x[1]], l: x[2], s: x[3], a: (pos ? '+' : '−') + Math.abs(x[4]), c: pos ? '#05ffa1' : '#b2b7c7', bg: pos ? 'rgba(5,255,161,.08)' : 'rgba(178,183,199,.06)' };
});
return {
rows: rows, hasItems: !vacio, empty: vacio,
saldo: vacio ? '0' : '120', gan: vacio ? '0' : '+285', gas: vacio ? '0' : '−240',
more: open ? 'VER MENOS' : 'VER MÁS',
toggle: () => this.setState({ open: !open })
};
}
}
</script>
</body>
</html>
