<!doctype html>
<html lang="es">
<head>

<body>
<x-dc>

.im{background:center/contain no-repeat content-box;padding:2px;box-sizing:border-box}
.ph{background:center 12%/cover no-repeat;border:1px solid rgba(0,240,255,.35);box-sizing:border-box}
.i-ath{background-image:url(/_blob/9da85345e94e5f91f11240ac38d5c58d)}
.i-esp{background-image:url(/_blob/afab1ff9f1c954d5ecc8200c3dcf500d)}
.i-fla{background-image:url(/_blob/b6f3599a4863f2d04df62ca2925478fe)}
.i-cap{background-image:url(/_blob/1eb70b09ff1dfebea1ee8d685df7af07)}
.i-nyk{background-image:url(/_blob/cf44a5a61913d439a6928335e67150eb)}
.i-mia{background-image:url(/_blob/10fda615cda9a0af6884ca922825e90b)}
.i-bos{background-image:url(/_blob/e9b400da9580608c75ff00a2c1dc11c5)}
.i-mil{background-image:url(/_blob/aea89ff3989ccce3b75d8343a05a3743)}
.i-alc{background-image:url(/_blob/93372743515ef3f3b1a897cc2669b845)}

<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#07080c;color:#f0f1f5;font-family:'Exo 2',system-ui,sans-serif;font-size:14px;line-height:1.35;--p:#12141d;--p2:#181a25;--b:rgba(0,240,255,.2);--bs:rgba(0,240,255,.48);--ln:rgba(116,125,153,.22);--cy:#00f0ff;--gr:#05ffa1;--ye:#fcee0a;--mg:#ff2a6d;--mu:#b2b7c7;--fa:#939ab0;--d:'Rajdhani',sans-serif;--m:'JetBrains Mono',monospace;--cut:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))">
<header style="height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 6px;border-bottom:1px solid var(--b)">
<a href="Menu.dc.html" aria-label="Menú" style="width:44px;height:44px;background:none;color:var(--mu);display:grid;place-items:center;text-decoration:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a>
<div style="flex-grow:1;font:700 21px var(--d);letter-spacing:.14em">QUANT<span style="color:var(--cy)">FUT</span></div>
<a href="Coins.dc.html" aria-label="120 monedas" style="height:44px;padding:0 12px;display:flex;align-items:center;gap:6px;text-decoration:none;border:1px solid rgba(252,238,10,.4);background:rgba(252,238,10,.08);color:var(--ye);font:700 13px var(--m);clip-path:var(--cut)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>120</a>
<a href="Vip.dc.html" aria-label="Acceso VIP" style="width:44px;height:44px;display:grid;place-items:center;color:var(--ye)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18M4 15L3 7l5 4 4-6 4 6 5-4-1 8z"></path></svg></a>
</header>
<main style="flex-grow:1;min-height:0;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
<div role="group" aria-label="Deporte" style="flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{sports}}" as="sp" hint-placeholder-count="3">
<button onClick="{{sp.pick}}" style="height:44px;display:flex;align-items:center;justify-content:center;gap:7px;font:700 14px var(--d);letter-spacing:.08em;clip-path:var(--cut);cursor:pointer;border:1px solid {{sp.bd}};background:{{sp.bg}};color:{{sp.c}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{sp.d}}"></path></svg>{{sp.label}}</button>
</sc-for>
</div>
<h1 style="flex:none;margin:2px 0 0;font:700 22px var(--d);letter-spacing:.02em">Mercados y resultados</h1>
<section style="flex:none;border:1px solid rgba(0,240,255,.22);border-radius:18px;background:linear-gradient(135deg,#0f1c2b,#0a121d 70%);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 110px;align-items:center;gap:8px">
<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">
<div style="display:flex;align-items:center;gap:8px;font:700 12px var(--d);letter-spacing:.14em;color:var(--gr)"><span style="width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr)"></span>MODELO ACTIVO</div>
<div style="display:flex;align-items:baseline;gap:10px"><span style="font:700 54px/1 var(--d)">{{heroN}}</span><span style="font-weight:600;font-size:14px;line-height:1.2">familias de mercado en el radar</span></div>
<span style="font-size:12px;color:var(--mu)">Historial web desde el 26/10/2026</span>
<span style="margin-top:2px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12px;font-weight:600">{{heroLine}}</span>
</div>
<svg aria-hidden="true" width="110" height="110" viewBox="0 0 110 110" fill="none">
<path d="M55 55L55 5A50 50 0 0198 30Z" fill="rgba(0,240,255,.16)"></path>
<circle cx="55" cy="55" r="50" stroke="rgba(0,240,255,.3)"></circle>
<circle cx="55" cy="55" r="34" stroke="rgba(0,240,255,.22)"></circle>
<circle cx="55" cy="55" r="18" stroke="rgba(0,240,255,.22)"></circle>
<path d="M55 5v100M5 55h100" stroke="rgba(0,240,255,.16)"></path>
<circle cx="72" cy="22" r="4" fill="#2bd99f"></circle>
<circle cx="88" cy="50" r="3.5" fill="#4c9dff"></circle>
<circle cx="40" cy="30" r="3.5" fill="#ff8a3d"></circle>
<circle cx="30" cy="62" r="3.5" fill="#ffb020"></circle>
<circle cx="66" cy="72" r="3.5" fill="#c6f432"></circle>
<circle cx="52" cy="84" r="3" fill="#a78bfa"></circle>
<circle cx="80" cy="80" r="3" fill="#ff2a6d"></circle>
</svg>
</section>
<div style="flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
<a href="Mercado.dc.html" style="text-decoration:none;color:inherit;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;border:1px solid {{t.bd}};background:{{t.bg}}">
<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">
<div style="position:relative;width:46px;height:46px;display:grid;place-items:center">
<div style="position:absolute;inset:0;border-radius:50%;background:{{t.ring}}"></div>
<div style="position:absolute;inset:5px;border-radius:50%;background:#10151f"></div>
<span style="position:relative;font:700 12px var(--m)">{{t.label}}</span>
</div>
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.c}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>
</div>
<strong style="font-size:15px;line-height:1.2">{{t.name}}</strong>
<span style="font-size:11px;color:var(--mu)">Abiertos {{t.open}} · Resueltos {{t.res}}</span>
<span style="font-size:11px;font-weight:600">{{t.pub}}</span>
<div style="display:flex;height:8px;margin-top:2px"><div style="width:{{t.wOn}};background:{{t.dotsOn}}"></div><div style="width:{{t.wOff}};background:{{t.dotsOff}}"></div></div>
<div style="display:flex;align-items:center;gap:6px;margin-top:6px"><span style="font:700 10px var(--d);letter-spacing:.14em;color:var(--fa)">HOY</span><span aria-hidden="true" style="display:flex"><img alt="" src="{{t.s1}}" style="width:26px;height:26px;{{t.f1}}"><img alt="" src="{{t.s2}}" style="width:26px;height:26px;margin-left:-6px;{{t.f2}}"><img alt="" src="{{t.s3}}" style="width:26px;height:26px;margin-left:-6px;{{t.f3}}"><img alt="" src="{{t.s4}}" style="width:26px;height:26px;margin-left:-6px;{{t.f4}}"></span></div>
</a>
</sc-for>
</div>
</main>
<nav aria-label="Principal" style="height:64px;flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--p);border-top:1px solid var(--b)">
<a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font:600 11px var(--d);letter-spacing:.08em;color:var(--fa)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9h-6v-6H9v6H3z"></path></svg>INICIO</a>
<a href="Predicciones.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font:600 11px var(--d);letter-spacing:.08em;color:var(--fa)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>PICKS</a>
<a href="Mercados.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font:700 11px var(--d);letter-spacing:.08em;color:var(--cy);background:rgba(0,240,255,.07);box-shadow:inset 0 2px var(--cy)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M2 20h20"></path></svg>MERCADOS</a>
<a href="Coins.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font:600 11px var(--d);letter-spacing:.08em;color:var(--fa)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v10M15 9.5h-4.5a1.5 1.5 0 000 3h3a1.5 1.5 0 010 3H9"></path></svg>COINS</a>
<a href="Perfil.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font:600 11px var(--d);letter-spacing:.08em;color:var(--fa)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a4 4 0 100 8 4 4 0 000-8zM4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>PERFIL</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sport = (this.state || {}).sport || 'fut';
const C = 'M12 3a9 9 0 100 18 9 9 0 000-18z';
const sports = [
['fut', 'FÚTBOL', C + 'M12 8l3.5 2.5-1.3 4h-4.4l-1.3-4z'],
['nba', 'NBA', C + 'M3 12h18M12 3v18M5.6 5.6c3 3.5 3 9.3 0 12.8M18.4 5.6c-3 3.5-3 9.3 0 12.8'],
['ten', 'TENIS', C + 'M5.6 5.6c3.5 3.5 3.5 9.3 0 12.8M18.4 5.6c-3.5 3.5-3.5 9.3 0 12.8']
].map((x) => ({
label: x[1], d: x[2],
pick: () => this.setState({ sport: x[0] }),
c: x[0] === sport ? '#03110f' : '#b2b7c7',
bg: x[0] === sport ? '#00f0ff' : 'rgba(0,240,255,.05)',
bd: x[0] === sport ? '#00f0ff' : 'rgba(0,240,255,.2)'
}));
const I = {
flag: 'M5 21V4h11l-2 4 2 4H5',
shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
split: 'M12 21v-8M12 13L6 5M12 13l6-8',
trophy: 'M8 4h8v5a4 4 0 01-8 0zM12 13v5M8 20h8M8 6H5a3 3 0 003 4M16 6h3a3 3 0 01-3 4',
goal: C + 'M12 9a3 3 0 100 6 3 3 0 000-6z',
bars: 'M4 20V10M10 20V4M16 20v-8M2 20h20',
user: 'M12 4a4 4 0 100 8 4 4 0 000-8zM4 21c0-4.4 3.6-7 8-7s8 2.6 8 7'
};
const OR = '#ff8a3d', PU = '#a78bfa', GR = '#2bd99f', LI = '#c6f432', AM = '#ffb020', BL = '#4c9dff';
const D = {
fut: { n: 9, won: 510, res: 622, tiles: [
['Córners por equipo', OR, 'flag', 0, 0, 0], ['Hándicap asiático', PU, 'shield', 167, 203, 0],
['Marca un equipo', GR, 'goal', 88, 112, 0], ['Doble oportunidad', LI, 'split', 21, 25, 0],
['Córners totales', AM, 'flag', 44, 53, 0], ['Ganador del partido', BL, 'trophy', 61, 67, 0]] },
nba: { n: 6, won: 193, res: 311, tiles: [
['Ganador', BL, 'trophy', 41, 62, 3], ['Hándicap', PU, 'shield', 33, 58, 3],
['Total de puntos', GR, 'bars', 38, 60, 3], ['Puntos de jugador', LI, 'user', 52, 84, 6],
['Rebotes de jugador', AM, 'user', 29, 47, 4], ['Asistencias de jugador', OR, 'user', 0, 0, 2]] },
ten: { n: 6, won: 202, res: 324, tiles: [
['Ganador', BL, 'trophy', 77, 120, 4], ['Total de juegos', GR, 'bars', 35, 58, 4],
['Hándicap de juegos', PU, 'shield', 28, 46, 2], ['Primer set', LI, 'goal', 40, 63, 4],
['Total de sets', AM, 'split', 22, 37, 2], ['Juegos por jugador', OR, 'user', 0, 0, 0]] }
};
const rgba = (h, a) => 'rgba(' + parseInt(h.slice(1, 3), 16) + ',' + parseInt(h.slice(3, 5), 16) + ',' + parseInt(h.slice(5, 7), 16) + ',' + a + ')';
const d = D[sport];
const IMG = {
fut: [['im', '/_blob/9da85345e94e5f91f11240ac38d5c58d'], ['im', '/_blob/afab1ff9f1c954d5ecc8200c3dcf500d'], ['im', '/_blob/b6f3599a4863f2d04df62ca2925478fe'], ['im', '/_blob/1eb70b09ff1dfebea1ee8d685df7af07']],
nba: [['im', '/_blob/cf44a5a61913d439a6928335e67150eb'], ['im', '/_blob/10fda615cda9a0af6884ca922825e90b'], ['im', '/_blob/e9b400da9580608c75ff00a2c1dc11c5'], ['im', '/_blob/aea89ff3989ccce3b75d8343a05a3743']],
ten: [['ph', '/_blob/93372743515ef3f3b1a897cc2669b845'], ['ph', '/_blob/4e1d40a719ca20a5cf7c8a7c3cbc8642'], ['ph', '/_blob/c1cdfced4be0b368a59a4a6b87f01ce5'], ['ph', '/_blob/ea610f40c3f67b0aee7039a50569ca00']]
};
const FPH = 'display:block;box-sizing:border-box;object-fit:cover;object-position:center 12%;border:2px solid rgba(0,240,255,.55);border-radius:50%';
const FLG = 'display:block;box-sizing:border-box;object-fit:contain;padding:2px';
const tiles = d.tiles.map((r, ix) => {
const cl = [0, 1, 2, 3].map((j) => { const p = IMG[sport][(ix + j) % 4]; return { s: p[1], f: p[0] === 'ph' ? FPH : FLG }; });
const c = r[1];
const pct = r[4] ? Math.round(r[3] / r[4] * 100) : null;
const n = pct === null ? 0 : Math.round(pct / 10);
return {
name: r[0], c: c, icon: I[r[2]], open: r[5], res: r[4], s1: cl[0].s, f1: cl[0].f, s2: cl[1].s, f2: cl[1].f, s3: cl[2].s, f3: cl[2].f, s4: cl[3].s, f4: cl[3].f,
label: pct === null ? '–' : pct + '%',
pub: pct === null ? 'Sin publicaciones aún' : 'Publicado ' + r[3] + '/' + r[4],
ring: pct === null ? 'rgba(255,255,255,.14)' : 'conic-gradient(' + c + ' ' + pct + '%, rgba(255,255,255,.14) 0)',
bd: rgba(c, 0.38),
bg: 'linear-gradient(150deg,' + rgba(c, 0.3) + ',' + rgba(c, 0.07) + ' 62%), #10151f',
wOn: n * 11 + 'px',
wOff: (pct === null ? 0 : (10 - n) * 11) + 'px',
dotsOn: 'radial-gradient(circle at 4px 4px,' + c + ' 3.5px,transparent 4px) 0 0/11px 8px repeat-x',
dotsOff: 'radial-gradient(circle at 4px 4px,transparent 2.4px,rgba(255,255,255,.5) 2.5px 3.5px,transparent 4px) 0 0/11px 8px repeat-x'
};
});
const heroLine = d.won + '/' + d.res + ' publicados acertados · ' + (d.won / d.res * 100).toFixed(1).replace('.', ',') + ' %';
return { sports, tiles, heroN: d.n, heroLine };
}
}
</script>
