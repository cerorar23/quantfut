plugins {
    id 'com.android.application'
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
    // END: FlutterFire Configuration
    id 'dev.flutter.flutter-gradle-plugin'
}
def releaseKeyFile = rootProject.file('key.properties')
def releaseKeys = new Properties()
if (releaseKeyFile.exists()) {
    releaseKeyFile.withInputStream { releaseKeys.load(it) }
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !releaseKeyFile.exists()) {
    throw new GradleException('Release signing requires private android/key.properties; see docs/FIRMA_ANDROID.md')
}
android {
    namespace 'com.saptain.quantfut'
    compileSdk 37
    ndkVersion '30.0.16248370'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.saptain.quantfut'
        minSdk flutter.minSdkVersion
        targetSdk 37
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    signingConfigs {
        release {
            if (releaseKeyFile.exists()) {
                keyAlias releaseKeys['keyAlias']
                keyPassword releaseKeys['keyPassword']
                storeFile file(releaseKeys['storeFile'])
                storePassword releaseKeys['storePassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
dependencies {
    implementation 'com.tapjoy:tapjoy-android-sdk:14.4.0'
}
flutter {
    source '../..'
}
